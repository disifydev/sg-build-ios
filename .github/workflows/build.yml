# Сборка Sguardo для iPhone: компиляция → снимки всех экранов в симуляторе (без падений и белых экранов)
# → подпись (ручная: p12 + профиль App Store) → загрузка в App Store Connect (TestFlight).
# Минуты macOS дорогие: один прогон делает всё сразу, снимки уходят в ветку shots/<номер>.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "tools/**"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Загрузить в App Store Connect"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCHEME: Sguardo
      BUNDLE_ID: dev.disify.batch
      PROFILE_NAME: Sguardo AppStore Push2
      # номер сборки выше уже загруженных в эту запись App Store Connect (у Fewls была 6)
      BUILD_BASE: "200"
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Инструменты
        run: |
          xcodebuild -version
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          echo "BUILD_NUMBER=$((BUILD_BASE + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV

      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project "$SCHEME.xcodeproj" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > build-sim.log 2>&1 || {
              grep -E "error:|Error:" build-sim.log | sort -u | head -80; tail -30 build-sim.log; exit 1; }
          grep -E "warning:" build-sim.log | sort -u | head -30 || true
          ls build/dd/Build/Products/Debug-iphonesimulator/

      - name: Симулятор
        id: sim
        run: |
          set -e
          LIST=$(xcrun simctl list devices available)
          UDID=$(echo "$LIST" | grep -E "^ +iPhone 17 Pro \(" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          [ -n "$UDID" ] || UDID=$(echo "$LIST" | grep -E "^ +iPhone .*\(" | tail -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "$LIST" | grep "$UDID"
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          echo "$UDID" > .udid
          xcrun simctl boot "$UDID" || true
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$UDID" | grep -q Booted && break; sleep 3
          done
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/$SCHEME.app

      - name: Прогрев симулятора (первые запуски после установки медленные)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          UDID=$(cat .udid)
          for i in 1 2; do
            perl -e 'alarm shift; exec @ARGV' 90 xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" -fixture -login || true
            sleep 8
          done
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

      - name: Снимок 00-live (живой запуск без данных, сервер отвечает 401 и открывается вход)
        timeout-minutes: 2
        continue-on-error: true
        run: bash tools/shot.sh 00-live
      - name: Снимок 01-login (вход)
        timeout-minutes: 2
        run: bash tools/shot.sh 01-login -fixture -login
      - name: Снимок 02-code (код из письма)
        timeout-minutes: 2
        run: bash tools/shot.sh 02-code -fixture -screen code
      - name: Снимок 03-chats (чаты)
        timeout-minutes: 2
        run: bash tools/shot.sh 03-chats -fixture
      - name: Снимок 04-chat (чат)
        timeout-minutes: 2
        run: bash tools/shot.sh 04-chat -fixture -screen chat
      - name: Снимок 05-client (карточка клиента)
        timeout-minutes: 2
        run: bash tools/shot.sh 05-client -fixture -screen client
      - name: Снимок 06-today (сегодня)
        timeout-minutes: 2
        run: bash tools/shot.sh 06-today -fixture -screen today
      - name: Снимок 07-summary (сводка)
        timeout-minutes: 2
        run: bash tools/shot.sh 07-summary -fixture -screen summary
      - name: Снимок 08-profile (ещё)
        timeout-minutes: 2
        run: bash tools/shot.sh 08-profile -fixture -screen profile
      - name: Снимок 09-folders (папки)
        timeout-minutes: 2
        run: bash tools/shot.sh 09-folders -fixture -screen folders
      - name: Снимок 10-archive (архив)
        timeout-minutes: 2
        run: bash tools/shot.sh 10-archive -fixture -screen archive
      - name: Снимок 11-partners (партнёры)
        timeout-minutes: 2
        run: bash tools/shot.sh 11-partners -fixture -screen partners
      - name: Снимок 12-schedule (расписание)
        timeout-minutes: 2
        run: bash tools/shot.sh 12-schedule -fixture -screen schedule
      - name: Снимок 13-lists (классы и предметы)
        timeout-minutes: 2
        run: bash tools/shot.sh 13-lists -fixture -screen lists
      - name: Снимок 14-chat-tg (чат Telegram)
        timeout-minutes: 2
        run: bash tools/shot.sh 14-chat-tg -fixture -screen chat-tg
      - name: Снимок 15-chat-reply (ответ)
        timeout-minutes: 2
        run: bash tools/shot.sh 15-chat-reply -fixture -screen chat-reply
      - name: Снимок 16-chat-voice (голосовое)
        timeout-minutes: 2
        run: bash tools/shot.sh 16-chat-voice -fixture -screen chat-voice
      - name: Снимок 17-chat-preview (превью)
        timeout-minutes: 2
        run: bash tools/shot.sh 17-chat-preview -fixture -screen chat-preview
      - name: Снимок 18-viewer (просмотр фото)
        timeout-minutes: 2
        run: bash tools/shot.sh 18-viewer -fixture -screen viewer
      - name: Снимок 19-note (кружок)
        timeout-minutes: 2
        run: bash tools/shot.sh 19-note -fixture -screen note
      - name: Снимок 20-toast (отмена)
        timeout-minutes: 2
        run: bash tools/shot.sh 20-toast -fixture -screen client -toast
      - name: Снимок 21-chats-folder (папка в чатах)
        timeout-minutes: 2
        run: bash tools/shot.sh 21-chats-folder -fixture -screen chats-folder
      - name: Снимок 22-chats-select (выбор чатов)
        timeout-minutes: 2
        run: bash tools/shot.sh 22-chats-select -fixture -screen chats-select
      - name: Снимок 23-chats-batch-folder (в папку)
        timeout-minutes: 2
        run: bash tools/shot.sh 23-chats-batch-folder -fixture -screen chats-folder-sheet
      - name: Снимок 24-chat-tr (перевод)
        timeout-minutes: 2
        run: bash tools/shot.sh 24-chat-tr -fixture -screen chat-tr
      - name: Снимок 25-chat-tr-sheet (язык перевода)
        timeout-minutes: 2
        run: bash tools/shot.sh 25-chat-tr-sheet -fixture -screen chat-tr-sheet
      - name: Снимок 26-profile-bottom (низ ещё)
        timeout-minutes: 2
        run: bash tools/shot.sh 26-profile-bottom -fixture -screen profile -bottom
      - name: Снимок 27-chat-transcript (расшифровка)
        timeout-minutes: 2
        run: bash tools/shot.sh 27-chat-transcript -fixture -screen chat-tg -transcript
      - name: Снимок 28-note-lock (кружок на замке)
        timeout-minutes: 2
        run: bash tools/shot.sh 28-note-lock -fixture -screen note-lock
      - name: Снимок 29-chat-voice-rec (запись голосового)
        timeout-minutes: 2
        run: bash tools/shot.sh 29-chat-voice-rec -fixture -screen chat-voice-rec
      - name: Снимок 30-staff (сотрудники)
        timeout-minutes: 2
        run: bash tools/shot.sh 30-staff -fixture -screen staff

      - name: Снимок 31-chat-draft (часы в поле ввода)
        timeout-minutes: 2
        run: bash tools/shot.sh 31-chat-draft -fixture -screen chat-draft
      - name: Снимок 32-chat-sched (лист отложенной отправки)
        timeout-minutes: 2
        run: bash tools/shot.sh 32-chat-sched -fixture -screen chat-sched
      - name: Снимок 33-chat-scheduled (список запланированных)
        timeout-minutes: 2
        run: bash tools/shot.sh 33-chat-scheduled -fixture -screen chat-scheduled
      - name: Снимок 34-chat-pin (закрепить у себя или у обоих)
        timeout-minutes: 2
        run: bash tools/shot.sh 34-chat-pin -fixture -screen chat-pin
      - name: Снимок 35-client-media (материалы: медиа)
        timeout-minutes: 2
        run: bash tools/shot.sh 35-client-media -fixture -screen client-materials -bottom
      - name: Снимок 36-client-files (материалы: файлы)
        timeout-minutes: 2
        run: bash tools/shot.sh 36-client-files -fixture -screen client-materials -bottom -mtab files
      - name: Снимок 37-client-links (материалы: ссылки)
        timeout-minutes: 2
        run: bash tools/shot.sh 37-client-links -fixture -screen client-materials -bottom -mtab links
      - name: Снимок 38-client-voice (материалы: голосовые)
        timeout-minutes: 2
        run: bash tools/shot.sh 38-client-voice -fixture -screen client-materials -bottom -mtab voice

      - name: Снимки для App Store (6.9 дюйма)
        timeout-minutes: 8
        run: bash tools/appstore.sh

      - name: Снимки App Store в артефакт
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screens
          path: shots/appstore

      - name: Проверка снимков
        id: screens
        run: bash tools/check.sh

      - name: Снимки в ветку
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b shots && git add .
          git -c user.name=ci -c user.email=ci@disify.dev commit -qm "снимки прогона $GITHUB_RUN_NUMBER (сборка $BUILD_NUMBER)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" shots:shots/$GITHUB_RUN_NUMBER

      - name: Подпись
        if: steps.screens.outcome == 'success'
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DIST_P12: ${{ secrets.DIST_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILES_TGZ: ${{ secrets.PROFILES_TGZ }}
        run: |
          set -e
          KC="$RUNNER_TEMP/sign.keychain-db"; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for D in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$D"; echo "$PROFILES_TGZ" | base64 --decode | tar xz -C "$D"
          done
          ls "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Архив
        if: steps.screens.outcome == 'success'
        run: |
          set -o pipefail
          ruby -ryaml -e '
            y = YAML.load_file("project.yml")
            b = y["targets"][ENV["SCHEME"]]["settings"]["base"]
            b["CODE_SIGN_STYLE"] = "Manual"
            b["CODE_SIGN_IDENTITY"] = "Apple Distribution"
            b["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
            File.write("project.yml", y.to_yaml)'
          xcodegen generate
          xcodebuild archive -project "$SCHEME.xcodeproj" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "build/$SCHEME.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > build-archive.log 2>&1 || {
              grep -E "error:|Error:" build-archive.log | sort -u | head -60; tail -40 build-archive.log; exit 1; }
          echo "архив собран, сборка $BUILD_NUMBER"

      - name: Экспорт .ipa
        if: steps.screens.outcome == 'success'
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "build/$SCHEME.xcarchive" -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export 2>&1 | tail -20
          ls -la build/export
          cd build/export && unzip -q -o *.ipa && codesign -d --entitlements - --xml Payload/*.app 2>/dev/null | plutil -p - || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/*.app/Info.plist

      - name: Загрузка в App Store Connect
        if: steps.screens.outcome == 'success' && (github.event_name == 'push' || inputs.upload)
        run: |
          set -o pipefail
          xcrun altool --upload-app -f build/export/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --show-progress 2>&1 | tail -25
